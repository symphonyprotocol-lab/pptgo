# Three secrets have no default and the stack refuses to start without them: the session
# signing key, the database password and the object-store keys. They used to fall back to
# `pptgo` / `pptgoadmin`, which meant the documented one-liner — `cp .env.example .env &&
# docker compose up -d` — brought up a host whose object store answered to a credential
# printed in this repository.
#
# Postgres and rustfs are also published to loopback only. They are published at all just
# so a `npm run dev` running outside Docker can reach them; the web container talks to
# them over the compose network and never needs the host side. Set POSTGRES_BIND /
# RUSTFS_BIND to 0.0.0.0 to widen that deliberately.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pptgo}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, generate one with openssl rand -base64 24}"
      POSTGRES_DB: ${POSTGRES_DB:-pptgo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # The host side deliberately avoids 5432, and 5433 with it: a machine that already
      # runs Postgres is the common case, and the second instance on a box tends to have
      # taken 5433 already. The published ports sit in one block from the web port up, so
      # they are one range to remember and one range to firewall.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-3429}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pptgo} -d ${POSTGRES_DB:-pptgo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. The deck documents and thumbnails live here; the
  # bucket is created by the app on first write, so there is nothing to provision.
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "${RUSTFS_CONSOLE_ENABLE:-true}"
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env, generate one with openssl rand -base64 24}"
    volumes:
      - rustfs-data:/data
    ports:
      # 9000/9001 are what MinIO and rustfs conventionally take, and 9100/9101 are where
      # a second one lands, so the host side steps out of the way entirely; inside the
      # network the app still uses http://rustfs:9000
      - "${RUSTFS_BIND:-127.0.0.1}:${RUSTFS_API_PORT:-3430}:9000" # S3 API
      - "${RUSTFS_BIND:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-3431}:9001" # console

  web:
    # Two ways this image comes to exist, and the deployment picks one by setting the
    # variable. On a server it is the tag CI pushed to GHCR, so `docker compose pull`
    # fetches a build that already happened and the box needs no source tree and no
    # toolchain. Left unset — which is every clone — it names the image `docker compose
    # up --build` produces locally, and nothing about the developer flow changes.
    image: ${WEB_IMAGE:-pptgo-web:local}
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pptgo}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-pptgo}

      # Auth.js. AUTH_URL is the public origin users reach — Google compares it against
      # the redirect URI registered in the console.
      #
      # AUTH_SECRET signs the session cookie and Auth.js refuses to start without it. The
      # Google pair is optional, so the stack still comes up with the landing page and the
      # sign-in-free editor working; pressing the sign-in button then lands on
      # /login?error=Configuration, which says what is missing.
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env, generate one with openssl rand -base64 32}"
      AUTH_URL: "${AUTH_URL:-http://localhost:3428}"
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: "${AUTH_GOOGLE_ID:-}"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET:-}"

      # The container next door, unless a deployment says otherwise. Keeping it internal
      # is the point rather than an accident: a deck runs to megabytes and every editor
      # load fetches one, so that request never leaves the host, needs no TLS handshake
      # and does not stop working when a certificate lapses. The variable exists for the
      # deployment whose bucket genuinely lives somewhere else.
      S3_ENDPOINT: "${S3_ENDPOINT:-http://rustfs:9000}"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-pptgo}
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?}"
    ports:
      # 3428 on the host, 3000 inside. Next's own default is what a box is most likely to
      # already have something sitting on — another Node app, someone's `npm run dev` — and
      # a collision there stops `docker compose up` dead. Inside the container nothing else
      # is listening, so the standard port stays.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3428}:3000"

volumes:
  postgres-data:
  rustfs-data:
