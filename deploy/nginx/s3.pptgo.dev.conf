# s3.pptgo.dev → rustfs's S3 API.
#
# Only the API port. The console on 9101 is a second, human-facing door onto the same
# bucket and has no business on the internet — leave it bound to loopback, or turn it off
# with RUSTFS_CONSOLE_ENABLE=false.
#
# The app itself does not need this name: web and rustfs share a compose network and talk
# over it. This is for everything outside — a backup job, `aws s3` from a laptop, another
# host — and for that it has to be exactly faithful, because S3 requests are signed.
#
#   sudo cp s3.pptgo.dev.conf /etc/nginx/sites-available/s3.pptgo.dev
#   sudo ln -s /etc/nginx/sites-available/s3.pptgo.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d s3.pptgo.dev

server {
    listen 80;
    listen [::]:80;
    server_name s3.pptgo.dev;

    # whole deck documents travel through here, and the app's own ceiling is 26MB
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:9100;

        proxy_http_version 1.1;

        # The one line this file cannot do without. SigV4 signs the Host header, so the
        # client signs "s3.pptgo.dev" and rustfs recomputes the signature from whatever
        # Host it receives. nginx's default is to send the *backend's* name instead, and
        # then every request comes back 403 SignatureDoesNotMatch — verified both ways
        # against a real rustfs before this file was written.
        #
        # $http_host rather than $host: it keeps the port when there is one, which is what
        # a client on a non-standard port will have signed.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # object storage moves whole files: streaming them straight through beats spooling
        # each one to the proxy's disk first, in both directions
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
