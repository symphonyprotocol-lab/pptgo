# pptgo.dev → the web container.
#
# Port 80 only, on purpose: certbot rewrites this file when TLS is added, and a redirect
# written by hand before that exists is a redirect to a port that does not answer yet.
#
#   sudo cp pptgo.dev.conf /etc/nginx/sites-available/pptgo.dev
#   sudo ln -s /etc/nginx/sites-available/pptgo.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pptgo.dev          # adds 443 and the redirect

server {
    listen 80;
    listen [::]:80;
    server_name pptgo.dev www.pptgo.dev;

    # a deck is one JSON document with its images inlined, and the app accepts 51MB of it
    # (MAX_REQUEST_BYTES). nginx's default is 1MB, which would turn a deck with a few
    # screenshots in it into a 413 the editor reports as a failed save. Kept above the
    # app's own ceiling so the refusal comes from the app, which can say what the limit is
    client_max_body_size 56m;

    location / {
        proxy_pass http://127.0.0.1:3428;

        proxy_http_version 1.1;

        # the app builds absolute URLs — the MCP endpoint it prints, the OAuth callback —
        # from what it is reached by. $host without the port is right here because the
        # public site answers on the default one
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        # so that the day TLS lands, the app knows its links are https:// without anything
        # else being edited
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 120s;
    }

    # The MCP endpoint holds a response open and writes to it as the exchange goes on.
    # Buffering that would collect the whole stream before forwarding any of it, which
    # turns a live protocol into one that answers all at once at the end — or times out.
    location /api/mcp {
        proxy_pass http://127.0.0.1:3428;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
        proxy_cache off;
        # an agent can sit on one exchange while it thinks
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
